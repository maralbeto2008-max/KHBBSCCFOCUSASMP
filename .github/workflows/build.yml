on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 python3-pil
      - name: Build DLL
        run: CC=x86_64-w64-mingw32-gcc bash build.sh
      - name: Package for OpenKH
        run: bash tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BBS-KH2-Style
          path: dist/BBS-KH2-Style.zip
